<!doctype html>
<!--
  ==========================================================================
  PORTFOLIO · Gemma Centrone
  Landing page de una sola página (index.html)

  Estructura general:
    1. head ........... metadatos, SEO, Open Graph, tipografías y estilos
    2. Loader ......... pantalla de carga con contador y barra de progreso
    3. Cursor ......... cursor personalizado (solo en dispositivos con ratón)
    4. SiteContent .... contenedor de la web, aparece al terminar el loader
         Header ....... logo + navegación principal
         Main ......... contenido principal
         Footer ....... pie de página

  Metodología CSS: SUIT CSS
    Componente ...... PascalCase            .Loader
    Descendiente .... Componente-camelCase  .Loader-track
    Modificador ..... Componente--camelCase .Button--primary
    Estado .......... is-camelCase          .Loader.is-hidden
    Utilidad ........ u-camelCase           .u-visuallyHidden

  Uso de IA: la estructura base de este archivo se generó con Claude (Anthropic)
  a partir del prompt "base HTML semántica para un portfolio de una página
  siguiendo la rúbrica del CEI". El contenido y los ajustes son propios.
  ==========================================================================
-->
<html lang="es">
  <head>
    <!-- ===== Metadatos básicos ===== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemma Centrone · Frontend Developer</title>
    <meta
      name="description"
      content="Portfolio de Gemma Centrone, frontend developer en Madrid. Proyectos de diseño y desarrollo web con HTML, CSS y JavaScript."
    />
    <meta name="author" content="Gemma Centrone" />
    <meta name="theme-color" content="#1e2a5a" />
    <!-- TODO: sustituir por la URL definitiva (GitHub Pages o dominio propio) -->
    <link rel="canonical" href="https://usuario.github.io/portfolio/" />

    <!-- ===== Open Graph (cómo se ve al compartir en redes) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gemma Centrone · Frontend Developer" />
    <meta
      property="og:description"
      content="Proyectos de diseño y desarrollo web con HTML, CSS y JavaScript."
    />
    <meta property="og:url" content="https://usuario.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://usuario.github.io/portfolio/img/og-image.jpg"
    />
    <meta property="og:locale" content="es_ES" />

    <!-- ===== Twitter / X ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gemma Centrone · Frontend Developer" />
    <meta
      name="twitter:description"
      content="Proyectos de diseño y desarrollo web con HTML, CSS y JavaScript."
    />
    <meta
      name="twitter:image"
      content="https://usuario.github.io/portfolio/img/og-image.jpg"
    />

    <!-- ===== Favicon ===== -->
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />

    <!-- ===== Tipografías: preconnect ordenado + un único link a Google Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;600&display=swap"
    />

    <!-- ===== Estilos propios ===== -->
    <link rel="stylesheet" href="./css/style.css" />

    <!-- ===== Scripts (defer: no bloquean el renderizado) ===== -->
    <script src="./js/main.js" defer></script>
  </head>

  <body>
    <!-- ===== LOADER: pantalla de carga con contador y barra de progreso ===== -->
    <div
      class="Loader"
      role="progressbar"
      aria-label="Cargando"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <p class="Loader-count"><span class="Loader-number">0</span>%</p>
      <div class="Loader-track">
        <div class="Loader-bar"></div>
      </div>
    </div>

    <!-- ===== CURSOR: fuera de SiteContent para que se vea siempre ===== -->
    <div class="Cursor" aria-hidden="true"></div>

    <!-- ===== SITE CONTENT: aparece cuando termina el loader ===== -->
    <div class="SiteContent">
      <!-- ===== HEADER ===== -->
      <header class="Header">
        <a class="Header-logo" href="#inicio" title="Volver al inicio"
          >Gemma /</a
        >
        <!-- Navegación principal -->
        <nav class="Nav" aria-label="Navegación principal">
          <ul class="Nav-list">
            <li><a href="#studies" data-i18n="nav.percorso">Percorso</a></li>
            <li><a href="#skills" data-i18n="nav.stack">Stack</a></li>
            <li><a href="#projects" data-i18n="nav.progetti">Progetti</a></li>
            <li><a href="#passions" data-i18n="nav.passioni">Passioni</a></li>
            <li><a href="#contacts" data-i18n="nav.contatti">Contatti</a></li>
          </ul>
          <div class="Nav-hamburger">
            <button
              class="Menu-nav"
              aria-label="apri menu"
              aria-expanded="false"
            ></button>
          </div>
        </nav>
      </header>
      <!-- ===== /HEADER ===== -->

      <!-- ===== MAIN ===== -->
      <main class="Main">
        <div class="Hero"></div>
        <section class="Stack">App</section>
        <div class="Video">
          <video
            class="Video-player"
            autoplay
            muted
            loop
            playsinline
            poster="./assets/video-gemma.webp"
          >
            <source src="./assets/Video_Gemma.mov" type="video/mp4" />
          </video>
        </div>
        <section class="About">Say</section>
        <div class="Passions">Map</div>
        <section
          class="Project"
          aria-roledescription="carrusel"
          aria-label="Proyectos destacados"
        >
          <div class="Project-slide isActive">
            <picture class="Project-picture">
              <img
                class="Project-img"
                src="/assets/TERZA-IMMAGINE.webp"
                alt="Home de la web de MAMO"
                width="1440"
                height="900"
                loading="lazy"
              />
            </picture>
            <a
              class="Project-caption"
              href="https://mamohkltd.com/"
              title="Ver la web de MAMO (se abre en una pestaña nueva)"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="Project-role">Cliente · Design · Code</span>
              <span class="Project-title">MAMO</span>
              <span class="Project-arrow" aria-hidden="true">↗</span>
            </a>
          </div>

          <div class="Project-slide">
            <picture class="Project-picture">
              <img
                class="Project-img kikeroo"
                src="./assets/image (2).png"
                alt="Fotograma de la animación 3D From Noise to Music"
                width="1440"
                height="900"
                loading="lazy"
              />
            </picture>
            <a
              class="Project-caption"
              href="https://arcangelo7.github.io/maderna-animation/index.html"
              title="Ver From Noise to Music (se abre en una pestaña nueva)"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="Project-role">Università di Bologna · 3D</span>
              <span class="Project-title">Kikeroo</span>
              <span class="Project-arrow" aria-hidden="true">↗</span>
            </a>
          </div>

          <div class="Project-slide">
            <picture class="Project-picture">
              <img
                class="Project-img"
                src="./assets/mirabilia.jpg"
                alt="Portada de la revista web Mirabilia"
                width="1440"
                height="900"
                loading="lazy"
              />
            </picture>
            <a
              class="Project-caption"
              href="https://mirabiliamagazine.github.io/mirabilia/"
              title="Ver Mirabilia (se abre en una pestaña nueva)"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="Project-role">Rivista web</span>
              <span class="Project-title">Mirabilia</span>
              <span class="Project-arrow" aria-hidden="true">↗</span>
            </a>
          </div>

          <div class="Project-controls">
            <button
              class="Project-button Project-button--prev"
              type="button"
              title="Proyecto anterior"
              aria-label="Proyecto anterior"
            >
              ←
            </button>
            <p class="Project-counter">
              <span class="Project-current">1</span> / 3
            </p>
            <button
              class="Project-button Project-button--next"
              type="button"
              title="Proyecto siguiente"
              aria-label="Proyecto siguiente"
            >
              →
            </button>
          </div>
        </section>

        <section class="Playlist">
          <div class="Grid-img">
            <img
              src="./assets/playlist.png"
              width="1440"
              height="900"
              loading="lazy"
            />
          </div>
          <div class="Lightbox">
            <img src="./assets/img.jpg" alt="" />
            <button class="Lightbox-btn">Click</button>
          </div>
        </section>
        <section class="Contact">
          <a class="Contact-link" href="#contacts" title="Ir a Contactos">
            <span class="Contact-text">Scrivimi</span>
            <span class="Contact-wave" aria-hidden="true">
              <svg class="Contact-svg" viewBox="0 0 192 12">
                <path
                  d="M0 6 Q 6 0 12 6 T 24 6 T 36 6 T 48 6 T 60 6 T 72 6 T 84 6 T 96 6 T 108 6 T 120 6 T 132 6 T 144 6 T 156 6 T 168 6 T 180 6 T 192 6"
                />
              </svg>
            </span>
          </a>
        </section>
      </main>
      <div
        class="Lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Playlist de Gemma en Spotify"
      >
        <div class="Lightbox-box">
          <button
            class="Lightbox-close"
            type="button"
            title="Cerrar"
            aria-label="Cerrar"
          >
            ✕
          </button>
          <iframe
            class="Lightbox-player"
            title="Playlist de Gemma en Spotify"
            data-src="https://open.spotify.com/embed/playlist/5BgIAHVkJTFtrLd0W339nG?utm_source=generator&amp;theme=0"
            allow="
              autoplay;
              clipboard-write;
              encrypted-media;
              fullscreen;
              picture-in-picture;
            "
          ></iframe>
          <a
            class="Lightbox-link"
            href="https://open.spotify.com/playlist/5BgIAHVkJTFtrLd0W339nG"
            title="Abrir la playlist en Spotify (se abre en una pestaña nueva)"
            target="_blank"
            rel="noopener noreferrer"
            >Apri in Spotify →</a
          >
        </div>
      </div>
      <!-- ===== /MAIN ===== -->

      <!-- ===== FOOTER ===== -->
      <footer class="Footer"></footer>
      <!-- ===== /FOOTER ===== -->
    </div>
    <!-- ===== /SITE CONTENT ===== -->
  </body>
</html>
